name: Build MDS Chatwoot v4.17.0 candidate

on:
  push:
    branches:
      - mds/v4.17.0-white-label
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/mundodigitalsolucoes/chatwoot
  IMAGE_TAG: v4.17.0-mds-candidate

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact MDS branch
        uses: actions/checkout@v4

      - name: Validate MDS white-label contract
        run: bash script/mds_white_label_check.sh

      - name: Strip enterprise code for CE image
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### MDS Atendimento candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base upstream: Chatwoot v4.17.0" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production stable/rollback remains: \`ghcr.io/mundodigitalsolucoes/chatwoot:v4.12.1-mds\`" >> "$GITHUB_STEP_SUMMARY"
